<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* 这个 WebView 全程 detached、尺寸 0,布局对它没有意义 ——
     但 DOCTYPE 仍然必须写:缺了会落进 quirks 模式(AGENTS.md §19 记的那个坑),
     canvas 的尺寸计算会跟着走偏。 */
  html, body { margin: 0; padding: 0; background: transparent; }
</style>
</head>
<body>
<script src="mermaid.min.js"></script>
<script>
// 宿主页:离线 mermaid 光栅化。一次只放一个图进去(见下面 chain 的注释)。
//
// 运行时版本锁 **mermaid 12.1.0**,必须跟 opencc-web packages/zai 一致 ——
// 服务端 prompt 的图型清单是照着某个版本的 detector 注册表写的,两端错开就会
// 出现「web 出图、app 静默回退成代码块」。改版本走 `tools/fetch-mermaid.sh`。
(function () {
  var currentTheme = null;

  /**
   * 把 HTML 实体(`&nbsp;` `&mdash;` …)换成 XML 数字字符引用。
   *
   * ⚠️ 这是本项目能渲染复杂流程图的前提。mermaid 会在节点/标题文本里吐
   * **HTML 实体**,而 XML 只认 `&amp; &lt; &gt; &quot; &apos;` 五个 ——
   * `&nbsp;` 在 XML 里是**未定义实体,直接解析失败**。后果有两处同源症状:
   *   ① `img.src = data:image/svg+xml,…` 加载失败 → onerror → 整块回退成代码块
   *   ② DOMParser 解析出 <parsererror>,取不到 viewBox → 尺寸退化成 800x600 → 拉长变形
   * 纯中文标签的简单图不含实体,所以小图一直是好的,一复杂就全军覆没。
   *
   * 用 textarea 让浏览器自己的 HTML 解析器解出字符,免得维护一张实体表。
   */
  var ENTITY_RE = /&(#[0-9]+|#[xX][0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);/g;
  // HTML 真空元素:SVG/XML 里必须写成 <br/> 而不是 <br>。
  var VOID_TAG_RE = /<(br|hr|img|input|meta|link|source|area|base|col|embed|param|track|wbr)(\s[^>]*?)?>/gi;

  function toValidXml(svgText) {
    var out = svgText.replace(ENTITY_RE, function (m, name) {
      if (name.charAt(0) === '#') return m;   // 数字引用 XML 本来就合法
      var ta = document.createElement('textarea');
      ta.innerHTML = m;
      var ch = ta.value;
      if (ch === m || !ch) return m;          // 解不出来就原样留着
      return '&#' + ch.charCodeAt(0) + ';';
    });
    // 已经自闭合的(<br/>)不动 —— 负向前瞻兜住。
    out = out.replace(VOID_TAG_RE, function (m, tag, attrs) {
      if (/\/>$/.test(m)) return m;
      return '<' + tag + (attrs || '') + '/>';
    });
    return out;
  }

  /**
   * 从 SVG 文本里猜固有尺寸 —— **只在浏览器给不出答案时用**(见 rasterize 里
   * `img.naturalWidth` 那条主路径)。
   *
   * ⚠️ 这段推断有覆盖不到的图型,别当权威。0.28.0 之前它是唯一的尺寸来源,
   * 结果**甘特图整块渲成空白**:`gantt` 写出来的根 svg **既没有 viewBox,
   * 宽高也不是像素值**,于是这里落到 800×600 的兜底,而实际图约 2000×1100 ——
   * 画布比图小,内容全落在画布外,渲出来只剩一层底色。flowchart / sequence /
   * treemap / radar 这些恰好都带 viewBox,所以只有甘特图中招,「大部分图都好」
   * 的错觉一直持续到用户拿真实甘特图来试。
   *
   * 所以:主路径改成问浏览器(`Image.naturalWidth/Height`,SVG 规范里就是固有尺寸的
   * 定义),这里退成兜底。**不要把主路径改回正则。**
   */
  function svgSize(svgText) {
    var w = 0, h = 0;
    var m = /viewBox\s*=\s*["']\s*[-+\d.eE]+[\s,]+[-+\d.eE]+[\s,]+([-+0-9.eE]+)[\s,]+([-+0-9.eE]+)/.exec(svgText);
    if (m) { w = parseFloat(m[1]); h = parseFloat(m[2]); }

    if (!w || !h) {
      var aw = /<svg[^>]*\swidth\s*=\s*["']([^"']*)["']/.exec(svgText);
      var ah = /<svg[^>]*\sheight\s*=\s*["']([^"']*)["']/.exec(svgText);
      if (aw && aw[1].indexOf('%') < 0) w = parseFloat(aw[1]) || 0;
      if (ah && ah[1].indexOf('%') < 0) h = parseFloat(ah[1]) || 0;
    }

    if (!w || !h) {
      // 兜底命中时把根标签打出来 —— 下次再遇到没 viewBox 的图型,这一行直接
      // 告诉你该信哪个属性,不用再从头推。
      var root = /<svg\b[^>]*>/.exec(svgText);
      diag('svgSize 兜底: 没 viewBox,宽高也不是像素值,退回 800x600');
      diag('svgSize 兜底: 根 svg 标签 = ' + (root ? root[0].slice(0, 300) : '(没找到)'));
      w = 800; h = 600;
    }
    return { w: Math.max(1, Math.ceil(w)), h: Math.max(1, Math.ceil(h)) };
  }

  function diag() {
    // 统一走 console —— Kotlin 侧 WebChromeClient.onConsoleMessage 转发到
    // logcat -s LanAgentMermaid。渲染失败在 UI 上只是「静默回退成代码块」,
    // 没有这层就只能靠猜。
    try { console.log.apply(console, ['[mermaid]'].concat([].slice.call(arguments))); }
    catch (e) {}
  }

  /**
   * mermaid.initialize 的完整配置。
   *
   * 跟 opencc-web `packages/zai/src/web/src/components/markdown/mermaidRenderer.ts`
   * 的 initialize 保持同一条尺寸与错误路径 —— 那边的注释解释了每一条,这里只留
   * 对 app 侧真正有影响的部分。
   *
   * ⚠️ 运行时版本必须跟 opencc-web 的 `packages/zai` 一致(现为 12.1.0,见
   * `tools/fetch-mermaid.sh`):服务端 prompt 里那份图型清单是照着某个版本的
   * detector 注册表写的,两端错开就会出现「web 出图、app 静默回退成代码块」。
   *
   * 主题**故意**不跟 web 统一:那边是 `base` + 40 项 themeVariables 映射 zai 的
   * CSS 变量,app 这边的色板是 WbPalette,照抄会串色(AGENTS.md §25 记过同类教训)。
   * mermaid 内置的 dark / default 两套在本页表现正常,够用。
   */
  function MERMAID_CONFIG(dark) {
    // per-diagram 配置**不继承**顶层默认值 —— 漏写一个就退回默认行为,
    // 所以这两组是「每个用到标签的图型一份」,不是「挑几个代表性的」。
    var noHtmlLabels = { htmlLabels: false, useMaxWidth: false };
    var fixedWidth = { useMaxWidth: false };

    return {
      startOnLoad: false,
      theme: dark ? 'dark' : 'default',
      securityLevel: 'strict',
      fontFamily: '-apple-system, Roboto, "PingFang SC", sans-serif',

      // ⚠️ 必须关掉 HTML 标签。默认 true 时 mermaid 用
      // <foreignObject><div><p>…<br>…</p></div></foreignObject> 画多行标签,
      // 而 `<br>` 是 HTML 真空元素写法 —— SVG 按 **XML** 解析,`<br>` 必须
      // 自闭合,于是整张 SVG 解析失败,<img> 加载不出来,整块图静默回退成代码块。
      // 症状有迷惑性:标签里**不带换行的图**一切正常,一用 `<br/>` 就挂。
      //
      // 关掉后 mermaid 改用纯 SVG <tspan> 断行,顺带也避开了 foreignObject
      // 在 <img> 上下文里字体经常不生效的老问题。
      htmlLabels: false,

      // 关掉后根 svg 输出自然像素宽度。本页的 svgSize() 优先信 viewBox,
      // 开着 useMaxWidth 时 mermaid 写 width="100%",兜底路径会读到 100 这个
      // 荒谬的值(见 svgSize 注释)。跟 web 保持同一条尺寸路径。
      useMaxWidth: false,

      // 渲染失败时**不要**把 "Syntax error in text" 品牌 SVG 画进 document.body。
      // mermaid 的 draw() 抛错路径会先调 errorRenderer.draw(...),而
      // removeTempElements() 在 throw 之后才跑 —— 那个临时节点就留在 body 上。
      // 本页的 WebView 是 detached 0 尺寸所以看不见,但流式输出时每个半截代码块
      // 都会触发一次,几轮之后 body 堆满垃圾节点,后续渲染行为会变得不可预测。
      suppressErrorRendering: true,

      flowchart: noHtmlLabels,
      sequence: noHtmlLabels,
      class: noHtmlLabels,
      state: noHtmlLabels,
      er: noHtmlLabels,
      gantt: fixedWidth,
      pie: fixedWidth,
      mindmap: fixedWidth,
      journey: fixedWidth,
      timeline: fixedWidth,
      gitGraph: fixedWidth,
      quadrantChart: fixedWidth,
      xychart: fixedWidth,
      sankey: fixedWidth,
    };
  }

  function renderOne(id, src, dark, bg) {
    return new Promise(function (resolve) {
      /**
       * 成功回 `{"png":"data:image/png;base64,…","nw":2472,"nh":309}`,
       * 失败回空串(与之前一致,Kotlin 侧按空串判失败)。
       *
       * nw / nh 是 SVG 的 **viewBox 尺寸**,不是 PNG 的像素宽高 —— PNG 宽 =
       * ceil(nw * pickScale),缩放系数只存在于本页,回传 bitmap 宽高会让 Kotlin
       * 侧算不出「图相对原本设计尺寸被缩到百分之几」(卡片按 FillWidth 铺满,
       * 屏上宽度恒等于卡宽,这个百分比是「缩至 NN%」提示的唯一数据来源)。
       *
       * base64 只含 A-Za-z0-9+/=,JSON.stringify 不会产生任何转义,大字符串
       * 也不会有拼接开销。
       */
      var done = function (png, nw, nh) {
        var payload = '';
        if (png) {
          try { payload = JSON.stringify({ png: png, nw: nw, nh: nh }); }
          catch (e) { diag('payload 序列化失败 ' + (e && e.message)); }
        }
        try { AndroidMermaid.onResult(id, payload); } catch (e) {}
        resolve();
      };

      if (!window.mermaid) { diag('mermaid 未加载 id=' + id); done(null); return; }

      // mermaid.initialize 是全局的,切主题时要重新调。
      if (currentTheme !== dark) {
        currentTheme = dark;
        mermaid.initialize(MERMAID_CONFIG(dark));
      }

      diag('render 开始 id=' + id + ' 长度=' + src.length);
      var t0 = Date.now();

      var p;
      try {
        p = mermaid.render('mmd' + id, src);
      } catch (err) {
        diag('render 同步抛出 id=' + id + ' ' + (err && (err.message || err)));
        done(null);
        return;
      }

      Promise.resolve(p).then(function (res) {
        diag('render resolve id=' + id + ' 耗时=' + (Date.now() - t0) +
             ' 有svg=' + !!(res && res.svg));
        if (!res || !res.svg) { done(null); return; }
        return rasterize(res.svg, bg, done);
      }).catch(function (err) {
        diag('render reject id=' + id + ' ' + (err && (err.message || err)) +
             ' / ' + (err && err.str));
        done(null);
      });
    });
  }

  // ⚠️ mermaid.render **不可重入** —— 它往一个模块级的临时 DOM 容器里画,画完
  // 再拆掉。两次并发调用会互相把对方的中间节点删掉,后一个拿不到 svg。
  //
  // 症状很隐蔽:同一段回复里有两张图时,它们在同一次重组里一起发起,**第一张
  // 正常出图、第二张静默失败**回退成代码块,看起来就像「只渲染了一张」。
  // 所以这里用一条 promise 链串行化,一次只放一个进去。
  var chain = Promise.resolve();

  /** canvas 面积上限。超了 Chromium 会让 toDataURL 返回字面量 "data:," —— 静默失败。 */
  var MAX_CANVAS_PIXELS = 4.0e6;
  var MAX_CANVAS_EDGE = 4096;

  /**
   * 选缩放比:既要跟屏幕密度匹配,又不能把 canvas 撑爆。
   * 一张 2900x309 的宽流程图在 dpr 3 下是 8700x927 ≈ 8 百万像素,
   * 加上 devicePixelRatio 高的机器很容易越过浏览器的 canvas 上限。
   */
  function pickScale(w, h) {
    var dpr = Math.min(window.devicePixelRatio || 2, 3);
    var byArea = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(1, w * h));
    var byEdge = MAX_CANVAS_EDGE / Math.max(w, h);
    return Math.max(0.4, Math.min(dpr, byArea, byEdge));
  }

  function rasterize(svgText, bg, done) {
    // ⚠️ 必须先转实体 —— <img> 加载 SVG 走的是 XML 解析,&nbsp; 会让它整个加载失败。
    var safe = toValidXml(svgText);
    // 兜底值,只在本页算不出固有尺寸时才用(见 svgSize 的注释:甘特图会命中兜底)
    var fallback = svgSize(safe);
    diag('光栅化 svg长度=' + svgText.length + ' 兜底尺寸=' + fallback.w + 'x' + fallback.h);
    // 视口宽度打出来:甘特图的宽度是容器驱动的,这里一旦是 0,整张图会塌成
    // `viewBox="0 0 0 N"` → 渲出一张全空的图(0.28.0 实测踩到,见 Kotlin 侧
    // MermaidRenderer 的 VIEWPORT_W 注释)。宽度异常的图先看这一行。
    diag('视口 innerWidth=' + window.innerWidth + ' innerHeight=' + window.innerHeight +
         ' bodyW=' + document.body.clientWidth);

    // 直接问 XML 解析器要错误文本 —— 别猜
    try {
      var probe = new DOMParser().parseFromString(safe, 'image/svg+xml');
      var perr = probe.getElementsByTagName('parsererror')[0];
      if (perr) {
        diag('XML 解析失败: ' + String(perr.textContent).replace(/\s+/g, ' ').slice(0, 300));
      } else {
        diag('XML 解析通过');
      }
    } catch (e) {
      diag('XML 探测抛异常 ' + (e && e.message));
    }

    // 两条路依次试:data URL 简单但有长度上限,blob URL 没上限但可能污染 canvas。
    // 复杂流程图的 SVG 有 20 KB+,编码后 CJK 一个字膨胀到 9 字符,很容易撞上
    // WebView 的 data URL 上限 —— 那种情况下 onerror 且拿不到任何原因。
    var dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(safe);
    diag('dataURL 长度=' + dataUrl.length);

    var settled = false;
    var tryLoad = function (url, label) {
      var img = new Image();
      img.onload = function () {
        if (settled) return;
        settled = true;

        // ⚠️ 固有尺寸以**浏览器解析出来的**为准,不要用 svgSize 的正则推断 ——
        // SVG 规范里固有尺寸就是 naturalWidth/naturalHeight,而正则覆盖不到
        // 「既没 viewBox、宽高也不是像素值」的图型(甘特图就是)。
        // 0.28.0 之前在这里就用 svgSize 的结果定画布,甘特图整块渲成空白。
        var nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
        if (nw <= 0 || nh <= 0) {
          diag('图片没有固有尺寸(naturalWidth=' + nw + '),退回兜底 ' + fallback.w + 'x' + fallback.h);
          nw = fallback.w; nh = fallback.h;
        }

        var scale = pickScale(nw, nh);
        var cv = document.createElement('canvas');
        cv.width = Math.ceil(nw * scale);
        cv.height = Math.ceil(nh * scale);
        var ctx = cv.getContext('2d');
        if (!ctx) { diag('getContext null,canvas=' + cv.width + 'x' + cv.height); done(null); return; }
        if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height); }

        try {
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          var out = cv.toDataURL('image/png');
          diag(label + ' 成功 固有=' + nw + 'x' + nh + ' 画布=' + cv.width + 'x' + cv.height +
               ' scale=' + scale.toFixed(2) +
               ' toDataURL 前缀=' + out.slice(0, 24) + ' 长度=' + out.length);
          done(out, nw, nh);
        } catch (err) {
          diag(label + ' 画到 canvas 时抛异常 ' + (err && (err.name + ': ' + err.message)));
          done(null);
        }
      };
      img.onerror = function () {
        if (settled) return;
        diag(label + ' 加载失败');
        if (label === 'dataURL') {
          // 换 blob 再试一次
          try {
            var blob = new Blob([safe], { type: 'image/svg+xml;charset=utf-8' });
            tryLoad(URL.createObjectURL(blob), 'blobURL');
          } catch (e) {
            diag('blob 也失败 ' + (e && e.message));
            done(null);
          }
        } else {
          done(null);
        }
      };
      img.src = url;
    };

    tryLoad(dataUrl, 'dataURL');
  }

  // Kotlin 侧通过 evaluateJavascript 调这个(参数走 JSON 编码,不用手拼引号)。
  window.__mermaidRender = function (id, src, dark, bg) {
    chain = chain
      .then(function () { return renderOne(id, src, dark, bg); })
      .catch(function () { /* renderOne 内部已兜过,这里是防链断掉 */ });
  };

  // mermaid.min.js 是同步 <script>,到这里已经可用 —— 通知 Kotlin 可以开工了。
  if (window.mermaid) {
    try { AndroidMermaid.ready(); } catch (e) {}
  } else {
    // 脚本没加载出来也要报一声,否则 Kotlin 会一直等 ready() 超时。
    setTimeout(function () { try { AndroidMermaid.ready(); } catch (e) {} }, 0);
  }
})();
</script>
</body>
</html>
