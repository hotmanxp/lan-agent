org.gradle.jvmargs=-Xmx2800m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 编译跑在 Gradle 进程里,不另起 Kotlin daemon。
#
# 为什么:Kotlin daemon 跟 Gradle 之间是 RMI,daemon 一崩,Gradle 侧看到的是
# "Error unmarshaling return header / EOFException",然后整个构建被带崩
# ("Gradle build daemon has been stopped")。这机器上 16GB 内存要分给模拟器、
# IDE 和好几个并发 agent,Kotlin daemon 是最容易被挤爆的那个。少一个 JVM
# 就少一个崩溃点,编译慢一点但能跑完。
#
# 堆也别开太大:Gradle(3G)+Kotlin daemon(3G)两个 JVM 的峰值叠起来超过
# 本机可用内存时,macOS 直接 SIGKILL 掉整个构建,Gradle 自己不报 OOM,
# 只留一句 "Gradle build daemon disappeared unexpectedly" 或 exit 137。
# 单 JVM 3G 是这机器上能跑通的组合。
kotlin.compiler.execution.strategy=in-process

# 单 worker + 关掉并行:这台机器上有 5+ 个 zai 实例和 IDE 同时在跑,
# 并行编译只会让峰值内存翻几倍然后被 macOS 杀掉。慢一点换跑得完。
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true